name: ByKaranteli
description: >-
  A crypto-derivatives market-structure data service built on a deterministic crypto-futures signal engine. Its free,
  no-key public REST API surfaces funding rates/arbitrage, open interest, liquidation maps, options (Deribit), ETF
  flows, order-flow toxicity (VPIN), Coinbase premium, CFTC COT positioning, and Fear & Greed / BTC-dominance indices,
  plus live signal performance and per-symbol/strategy leaderboards. It also offers a hosted MCP server, x402
  agent-payment endpoints, and CC0 datasets.
