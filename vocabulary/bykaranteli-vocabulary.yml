  - {term: Altcoin Season Index, slug: altcoin-season-index, url: 'https://bykaranteli.com/glossary/altcoin-season-index', live: true, definition: 'How many of the top 50 altcoins are beating BTC over 90 days; the current altseason or Bitcoin season reading.'}
  - {term: Basis, slug: basis, url: 'https://bykaranteli.com/glossary/basis', definition: 'Price gap between a futures contract and its underlying spot index.', appears_in_api: 'components.basisPct on /api/public/pressure'}
  - {term: Basis Points (bps), slug: basis-points, url: 'https://bykaranteli.com/glossary/basis-points', definition: '1 basis point = 0.01%. We use bps as the canonical unit for signal net return.', appears_in_api: 'netBps, avgNetBps, sumNetBps, maxDrawdownBps across performance endpoints'}
  - {term: Bitcoin Dominance (BTC.D), slug: btc-dominance, url: 'https://bykaranteli.com/glossary/btc-dominance', live: true, definition: "BTC's current share of total crypto market cap, the 24h change, what rising or falling dominance means, and the BTCDOMUSDT perp."}
