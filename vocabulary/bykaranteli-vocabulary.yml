name: ByKaranteli crypto derivatives glossary
description: >-
  The provider's published, per-term glossary of crypto-derivatives and
  signal-performance vocabulary. Each term has its own page; several are backed
  by live data rather than a static definition. Definitions below are the
  provider's own words, taken verbatim from each term page's meta description.
  Terms marked proprietary are ByKaranteli's own constructs and are the ones an
  integrator most needs defined, because they appear as fields in API responses.

term_count: 18
locales: [en, zh-Hans]
locale_note: 'Every term also has a Simplified Chinese twin under /zh/glossary/<term>.'

terms:
