  - {term: Funding Rate, slug: funding-rate, url: 'https://bykaranteli.com/glossary/funding-rate', live: true, definition: "What funding rates mean on perpetual futures, plus a live snapshot: BTC's current 8h rate, the market median, and today's most extreme positive and negative Binance perps.", appears_in_api: 'fundingRatePct; funding-history x402 operation'}
