  - {term: Long/Short Ratio, slug: long-short-ratio, url: 'https://bykaranteli.com/glossary/long-short-ratio', definition: 'The ratio of accounts or positions long versus short a perpetual. Extremes flag crowded trades that often resolve violently.'}
  - {term: Mark Price, slug: mark-price, url: 'https://bykaranteli.com/glossary/mark-price', live: true, definition: 'What mark price means on perpetual futures and why it differs from last price, plus live Binance BTCUSDT and ETHUSDT mark price, index price and basis.'}
  - {term: Open Interest, slug: open-interest, url: 'https://bykaranteli.com/glossary/open-interest', live: true, definition: "What open interest means in crypto futures, plus live data: BTCUSDT's 24h OI change and the biggest OI gainers and losers across Binance USDT-M perps.", appears_in_api: 'oi24hPct/oi4hPct/oi1hPct; oi-history x402 operation'}
