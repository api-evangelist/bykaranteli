      Free CC0 crypto datasets updated daily — BTC dominance, Fear & Greed and
      Altcoin Season Index history, per-symbol daily stats, and a six-exchange
      perpetual listing/delisting tracker. Mirrors https://bykaranteli.com/data.
    api_mirror: https://bykaranteli.com/api/v1/public/datasets/[name]

