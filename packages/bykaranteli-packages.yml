conventional_sdks:
  present: false
  note: >-
    ByKaranteli ships NO conventional client SDK in any language. The public API
    is unauthenticated JSON over HTTPS and the docs teach it with raw `curl` and
    a plain `fetch()` embed snippet. The one published package is the MCP server
    above — an agent transport, not a REST client library. This is a real gap:
    a provider whose whole positioning is machine consumption has no typed
    client for the humans wiring it up.

