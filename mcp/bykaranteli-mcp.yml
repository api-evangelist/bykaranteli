notes:
  - >-
    Input schemas above are the REAL ones returned by an anonymous tools/list —
    the verbatim JSON-RPC result (with full JSON Schema per tool) is saved at
    mcp/bykaranteli-mcp-tools.json. Fourteen of the twenty tools take no
    parameters at all.
  - >-
    The /developers page and the npm README both say "20 tools"; live
    introspection confirms exactly 20. An older apis.io note about the page
    stale-stating 10 tools no longer applies.
  - >-
    The MCP surface reads the FREE public API only. None of the 13 paid
    /api/x402/* endpoints are exposed as MCP tools — an agent that wants
    history/depth must pay over x402 directly. See mcp/bykaranteli-tool-crosswalk.yml.
