tools:
- name: get_market_indices
  description: 'Call this when the user asks about overall crypto market sentiment or macro state: the
    Fear & Greed index (today and yesterday), Bitcoin dominance percentage, total market cap, or the Retail
    Euphoria composite. Live values refreshed about every 30 minutes.'
  category: indices
  inputs: []
- name: get_liquidations
  description: Call this when the user asks how much was liquidated in crypto futures, whether longs or
    shorts got flushed, or for liquidation history. Returns daily long and short liquidation totals in
    USD per symbol and exchange, recorded from ByKaranteli's own stream collectors on every liquidation
    venue it counts, listed on bykaranteli.com/coverage (recorded events, a floor, not estimates). One
    row per finalized UTC day, symbol and exchange; history begins 2026-07-30 and grows daily. Without
    symbol, rows holds the first 30 rows (newest day, largest first) while summary covers every matching
    row; pass symbol or limit (up to 400) for more rows.
  category: liquidations
  inputs:
  - symbol
  - days
- name: get_etf_flows
  description: 'Call this when the user asks about Bitcoin, Ethereum, Solana or XRP spot ETF flows: daily
    net inflows or outflows, cumulative flow since launch, or total net assets of the US spot ETFs (IBIT,
    FBTC, ETHA, XRPC and the rest). Returns one row per finalized US trading day and asset with net inflow,
    total net assets, cumulative inflow since launch and value traded, all in USD. History by asset: BTC
    and ETH since 2025-05-20, SOL since 2025-10-28, XRP since 2026-09-08.'
  category: flows
  inputs:
  - asset
  - days
- name: get_funding_heatmap
  description: Call this when the user asks for the full current funding table across the ~30 most traded
    Binance perps (28-30 rows; contracts without a live funding print are skipped), or the funding rate
    of one specific coin. For a pre-ranked top-10 of the most extreme funding rates, use get_top_movers
    instead. Returns per-symbol funding rate (per settlement interval), 24h open interest change and 24h
    price change for the most traded Binance USDT-M perpetuals. Positive funding means longs pay shorts.
  category: funding
  inputs:
  - symbol
- name: get_funding_arbitrage
  description: Call this when the user asks about funding arbitrage, funding rate differences between
    exchanges, or delta-neutral carry trades. Compares funding across every venue on the board, from Binance,
    OKX and Bybit to Hyperliquid, dYdX and the smaller perp venues fed by the venue snapshot, for 12 major
    perps and returns the best long/short venue per symbol with gross and net annualized APR (net of taker
    fees and weekly rebalance cost). Each row lists its first 5 venue legs; pass symbol for every leg
    of one perp.
  category: funding
  inputs: []
- name: get_pressure_scores
  description: Call this when the user asks which coins are crowded or over-leveraged, or asks for the
    pressure/derivatives-stress score of specific coins. For a quick top-10 ranking of the highest-stress
    coins right now, use get_top_movers instead. Each symbol gets a 0-100 composite score built from funding
    rate, 1h/4h/24h open interest deltas and basis, with a LONG/SHORT/NEUTRAL direction and a plain-language
    regime label.
  category: derivatives
  inputs:
  - symbol
  - limit
- name: get_top_movers
  description: Call this when the user asks what is moving in crypto derivatives right now, which coins
    have the biggest open interest changes, the most extreme funding, the widest basis, or the highest
    derivatives stress. Returns four top-10 lists in one call.
  category: markets
  inputs: []
- name: get_cot_positioning
  description: 'Call this when the user asks how hedge funds or institutions are positioned in Bitcoin
    or Ethereum, or about the CFTC Commitments of Traders report. Returns net positions in contracts,
    week-over-week changes, open interest and notable extremes/streaks, from official CFTC data updated
    every Friday. Note: a large share of hedge fund shorts is the market-neutral basis trade, so the weekly
    change carries more signal than the level.'
  category: positioning
  inputs: []
- name: get_options_snapshot
  description: 'Call this when the user asks where the big options bets sit, about call/put walls, gamma
    exposure (GEX), the zero-gamma level, implied volatility (DVOL) or the IV term structure for Bitcoin
    or Ethereum, across options venues or on one venue. Daily snapshot of the listed option chains of
    every options venue we record, summed by default or one venue with venue: the call wall (largest call
    open interest above spot) and put wall (largest put open interest below spot), the largest bars on
    the whole axis, top strikes by open interest, put/call ratio, dealer hedging map, ATM IV by expiry
    (calls and puts interpolated at the money, iv_source names the venue whose quotes price the chain),
    each venue''s open interest (venues_included), and per expiry the open interest by side, the max pain
    strike (where the open contracts as a group pay out the least at settlement, not a price target) and
    the one-sigma implied move the ATM IV prices (expiries). DVOL is Deribit''s index whatever the venue.'
  category: options
  inputs: []
- name: get_coinbase_premium
  description: Call this when the user asks whether US investors are buying or selling Bitcoin or Ethereum,
    about the Coinbase Premium, or what the cash-and-carry basis trade pays. Returns the latest daily
    premium in percent, 7-day average, same-sign streak, the last 30 days, and annualized quarterly carry
    yields. History since 2017; positive premium = US buying pressure. The kimchi and Turkey premium daily
    rows cover the last 7 days; pass days (up to 90) for more.
  category: spot
  inputs: []
- name: get_flow_toxicity
  description: Call this when the user asks whether informed or toxic order flow is building, about VPIN,
    or whether market makers are under pressure in Bitcoin, Ethereum or Solana. Returns the current VPIN
    (0 = balanced, 1 = fully one-sided), its 90-day percentile, the danger threshold and the 24h average.
    Elevated readings historically precede volatility; VPIN says nothing about direction.
  category: microstructure
  inputs: []
- name: get_options_flow
  description: Call this when the user asks what big options players are buying, about block trades, or
    whether call or put premium dominates today. Returns 24h call vs put premium bought (net of the sold
    legs of the same multi-leg block or combo, so a spread counts its net premium), the block-trade share,
    the multi-leg structure count, and the largest prints of the last 48 hours with strikes, premium,
    IV, structure id and venue (Deribit or OKX). Updated every 15 minutes.
  category: options
  inputs: []
- name: get_slippage
  description: Call this when the user asks how much slippage a trade of a given size would face, how
    thick the books are, or which major perp market is thinnest right now. Returns live cost ladders in
    basis points for $10K to $5M market orders across 8 major perpetuals, both sides, from the full visible
    order book. Excludes fees; null = the book cannot absorb that size.
  category: microstructure
  inputs: []
- name: get_fomc_impact
  description: Call this when the user asks what Bitcoin does on Fed days, how FOMC statements move crypto,
    or when the next FOMC meeting is. Returns per-statement 5/30/60-minute BTC reactions measured from
    a minute-resolution record, the average move versus a normal half hour, the up/down split (near a
    coin flip), and the next meeting date. Description, not prediction.
  category: macro
  inputs: []
- name: get_liquidation_cascades
  description: 'Call this when the user asks what caused a recent crash or flush, about liquidation cascades,
    or who got liquidated. Returns auto-detected cascade incidents: when, total notional flushed, long/short
    split, which coins led, and BTC''s move during the window. Totals are an honestly-labeled lower bound
    from a real liquidation tape.'
  category: liquidations
  inputs: []
- name: get_liquidation_leaderboard
  description: Call this when the user asks for the biggest liquidation today or this week, who got liquidated
    for the most, the largest single liquidation print, or when in the day or week liquidations cluster
    (Asia, Europe or US hours, weekday by UTC hour). Returns the largest single liquidation prints of
    the last 24h, 7d or 30d (rank, symbol, venue, side where SELL means a long was liquidated, price,
    quantity, notional, millisecond time) recorded from the counted venues' public feeds, plus a 30-day
    weekday by UTC hour heatmap with hour, weekday and session totals. Binance publishes at most one print
    per second per symbol, so its rows are a floor.
- name: get_insurance_funds
  description: 'Call this when the user asks how big an exchange''s insurance fund is, whether a fund
    is shrinking or was used after a crash, how much exchanges hold to absorb bankrupt liquidations, or
    how a fund compares with the venue''s open interest. Returns the latest hourly reading per covered
    venue (every exchange the insurance fund board lists): the fund in USD (OKX''s own published total,
    the sum of priced pools elsewhere), per asset, 24h and 7d change, the fund as a percent of the venue''s
    perpetual open interest on the coins ByKaranteli tracks, and daily closes per venue. Set pools to
    include every pool row (the contracts it covers, asset, balance, USD). A fund is a balance the venue
    reports, not an audit of its reserves.'
- name: get_tokenized_stocks
  description: 'Call this when the user asks about tokenized stocks or stock tokens (xStocks, Ondo, Robinhood
    stock tokens, Coinbase tokenized stocks on Base, Binance bStocks, Backpack, Gate gStocks, Reality,
    Superstate, Figure, Dinari dShares, Securitize): how much of a stock exists onchain, which issuer
    or chain holds the most, whether a wrapper trades above or below the real share, which DEX pools or
    exchanges trade it. Returns the board ByKaranteli refreshes every 10 minutes: per underlying the reference
    share price and its session, each wrapper (issuer, chain, price, premium_pct against a fresh reference,
    DEX liquidity and 24h volume from admitted pools, supply in shares and dollars, holders, status),
    tokenized spot pairs on the exchanges the board lists, the perpetual futures cross, and totals (supply
    by issuer and chain, DEX volume, median premium). Each wrapper''s price_source names the price that
    valued its supply dollars (reference: the share''s reference price; issuer_oracle: the issuer''s own
    price for the token; wrapper: its own pool or exchange price; null: no dollars), and totals.priced_by
    counts the counted wrappers per level, unpriced included. Wrappers come from issuer sources only,
    never from a name search. Without underlying, each stock lists its first 3 wrappers and 3 exchange
    pairs; pass underlying for all of them.'
- name: get_open_interest
  description: 'Call this when the user asks whether leverage is entering or leaving the market, about
    open interest changes, or whether longs or shorts are building in a major coin. Returns 5-minute-resolution
    OI with 24h OI and price deltas and a four-regime read per symbol: longs building, shorts building,
    long squeeze, short squeeze, or quiet.'
  category: derivatives
  inputs: []
- name: get_psi_charge
  description: Call this when the user asks about the market's hidden liquidity state, PsiCharge, or whether
    parked money is deploying or stress is unwinding. Returns the current Psi score (0-100), state (superposition
    = charge building, collapse = low-stress discharge, purge = high-stress discharge and historically
    the most consistent risk-off state, ground = ordinary), stress locality, recent alarms and the year-split
    measured scorecard. Inputs are proprietary; outcomes are always published. Not a trade signal, not
    a crash predictor.
  category: indices
  inputs: []
- name: get_altseason
  description: Call this when the user asks whether it is altseason, how altcoins are doing against Bitcoin,
    or about market rotation. Returns the live Altcoin Season Index (share of the top 50 Binance perpetual
    altcoins beating BTC over the trailing 90 days; >=75 altseason, <=25 bitcoin season), the strongest
    and weakest large alts, and the recorded daily history (never reconstructed).
- name: get_quantum_exposure
  description: 'Call this when the user asks how much Bitcoin is vulnerable to a quantum computer, about
    quantum-exposed supply, P2PK coins, or Satoshi-era exposure. Returns the latest daily measurement
    from ByKaranteli''s own Bitcoin Core node: exposed BTC and its share of held value and UTXO count,
    composition by script family, dormancy cohorts, the dormant-P2PK watch set, and provenance hashes
    (base_height, base_hash, txoutset_hash) so any figure can be re-verified against any node.'
- name: get_metric_context
  description: 'Call this when the user asks whether a metric''s current reading is high or low, or what
    happened after similar readings. Buckets today''s value against the metric''s own recorded daily history
    and returns the median forward BTC return and up-share per bucket at +1/+3/+7 days, with the all-days
    base rate alongside. Honesty rules: buckets under 30 days are suppressed, and most metrics do NOT
    separate from the base rate; the interpretation says so plainly. History, not a forecast. Metrics
    include coinbase_premium_pct, kraken_btc_premium_pct, dvol_btc, fear_greed, funding_btc_daily_pct,
    etf_btc_net_flow_usd, vpin_btc, altseason_index, stablecoin_total_mcap_busd, fred_dff, fred_dgs10,
    fred_walcl_busd, fred_rrp_busd and the btc_* network series.'
- name: get_theme_indices
  description: Call this when the user asks which crypto narrative or sector is leading, about rotation
    between AI, RWA, DePIN, memecoins, layer 1, layer 2, DeFi or quantum coins, or for a theme index.
    Returns eight equal-weight fixed-basket indices rebased to 100 on 2025-01-01 with 1d/7d/30d/90d/YTD
    returns, vs BTC, and the member lists; daily points are omitted unless include_points is true.
- name: get_factor_board
  description: Call this when the user asks which indicators currently sit in an unusual band, whether
    a metric's current level historically preceded BTC moves, or for a cross-metric conditional overview.
    Returns every recorded metric in its historical band with the median 7-day BTC move that followed
    versus the base rate, with an n >= 30 gate; distributions, not forecasts.
- name: get_borrow_rates
  description: Call this when the user asks what it costs to borrow USDT, USDC, BTC, ETH or a major alt
    on an exchange, which venue has the cheapest borrow, whether stablecoin borrow cost is spiking, or
    what the carry of a basis trade is on a venue (funding minus borrow). Returns the latest annualised
    rate per venue and asset, 30 days of hourly series for the stablecoins and majors, and the carry table.
    Recorded hourly by ByKaranteli (Binance and OKX today). The series hold the last 24 hours unless hours
    (up to 720) or asset is passed.
- name: get_fee_table
  description: Call this when the user asks what an exchange charges to trade, how maker and taker fees
    compare across venues, whether a venue changed its fees, or what a round trip costs on a given notional.
    Returns base tier maker and taker per venue and market type (median across pairs where the venue prices
    per pair) and the fee change log, read daily by ByKaranteli from each venue's own fee endpoint.
- name: get_settlements
  description: Call this when the user asks what futures or options expire soon, when the next quarterly
    expiry is on an exchange, how many contracts settle this week, or at what price a dated future settled.
    Returns the next 60 days of dated future and option expiries grouped by date, venue and underlying
    from 54 venues' market lists, plus the settlement prices recorded as dated futures deliver. Without
    base, the first 30 expiry rows and the 30 newest settlement prices; pass base for one asset's full
    lists, or limit (up to 300).
- name: get_venue_profile
  description: 'Call this when the user asks about a specific exchange (Bybit, OKX, Gate, KuCoin, HTX,
    Bitget, MEXC, BitMEX, Hyperliquid ...): how many contracts it lists, its perp open interest and average
    funding, its leverage ladders, deposit and withdrawal networks and how many are paused, its base fee
    schedule, its status uptime and the recent event log (listings, delistings, leverage cuts, withdrawal
    pauses, incidents). Without venue returns the list of recorded venues.'
- name: get_withdrawal_status
  description: Call this when the user asks whether an exchange has paused withdrawals or deposits, which
    networks are open for an asset, what the withdrawal fee or minimum is on each venue, or which venue
    is cheapest to withdraw from. Without arguments returns the overview (withdrawals paused right now,
    ranked, plus recent suspension and resumption events). Pass asset (e.g. USDT) for every venue and
    network of that asset, and venue (e.g. kucoin) to narrow. Recorded daily by ByKaranteli from 20+ venues'
    public currency lists. The overview lists the first 30 paused networks and the 30 newest events; pass
    asset, or limit (up to 400) for more.
- name: get_leverage_tiers
  description: Call this when the user asks how much leverage an exchange allows on a coin, what the maintenance
    margin or risk limit ladder is, which venue offers the highest leverage for a symbol, or whether an
    exchange recently cut leverage. Returns the current ladder per venue (tier, notional floor and cap,
    max leverage, maintenance margin rate) recorded daily by ByKaranteli, plus a change log. Pass symbol
    for one base asset (e.g. SOL) and venue for one exchange (bybit, okx, gate, htx, bitget, mexc). Without
    symbol, the first 30 rows of each list and the first 5 tiers of each ladder; pass symbol for every
    tier, or limit (up to 300).
- name: get_venue_markets
  description: Call this when the user asks about total open interest across exchanges, which venues hold
    the most OI, DEX versus CEX share, funding dispersion between venues, or stablecoin pegs. Returns
    the latest 10-minute snapshot aggregates across every perpetual and spot feed we poll (the coverage
    field lists them); pass symbol for one coin's per-venue rows. Without symbol, rows holds the 30 venue
    markets with the largest open interest; pass symbol, or limit (up to 250) for more.
- name: get_lead_lag
  description: Call this when the user asks which exchange leads price discovery or whether spot or perp
    moves first. Returns per-pair daily cross-correlations of one-minute returns at lags -3..+3 and the
    lead asymmetry, with the share of days each venue led. Each pair's daily rows cover the last 7 days
    (its summary covers the whole window); pass days (up to 30) for more.
- name: get_iv_surface
  description: Call this when the user asks about implied volatility by strike or expiry, skew, put versus
    call IV, term structure of IV, or whether downside protection is expensive. Returns the IV surface
    (expiry x moneyness), per-expiry ATM / 25-delta put and call IV, skew and butterfly, and the constant-30d
    history, from the daily Deribit chain.
- name: get_whale_tape
  description: Call this when the user asks about whale trades, large market orders, or whether big players
    are buying or selling right now. Returns recent $1M+ aggressive prints recorded live from our own
    sockets and 24h aggregates with the buy share.
- name: get_correlations
  description: Call this when the user asks how correlated two coins are, for decorrelated pairs, or how
    tightly alts track BTC. Returns the 30-day rolling Pearson correlation matrix of daily returns across
    the top perpetuals.
- name: get_new_listings
  description: Call this when the user asks what new perpetuals were listed, which exchange listed a coin
    first, or about delistings. Returns listings and delistings across every exchange the hourly scan
    covers.
- name: get_macro_liquidity
  description: Call this when the user asks about macro liquidity, the Fed balance sheet, reverse repo,
    rates or stablecoin supply in relation to crypto. Returns the recorded daily series and latest values.
    Without days, each series holds its newest 7 points; pass days for the daily series, and series for
    one key over a long window.
- name: get_network_health
  description: Call this when the user asks about Bitcoin hashrate, difficulty or block fees (our node
    runs blocksonly, so there is no mempool series). Returns the recorded daily series and latest values
    measured on ByKaranteli's own node. Without days, each series holds its newest 7 points; pass days
    for the daily series, and series for one key over a long window.
- name: get_liqmap
  description: 'Call this when the user asks where liquidation clusters or liquidity pools sit for a perpetual,
    where leveraged longs/shorts would get liquidated, or for a liquidation heatmap reading. Returns the
    LiqMap snapshot for one symbol: modeled liquidation levels by price, zone aggregates and real liquidation
    prints from every liquidation venue ByKaranteli counts (listed on bykaranteli.com/coverage). On the
    Free plan the 24h view; on Builder and higher plans every timeframe from 1h to 30d. By default the
    30 real levels nearest the price and the 30 newest real prints; pass detail=true for all of them.'
- name: get_tradfi_board
  description: 'Call this when the user asks about stock perpetuals (TSLA, NVDA, AAPL, gold, S&P 500...),
    tokenized-equity perps, TradFi perp funding rates, open interest, liquidations, which exchanges list
    a stock perp, or whether the equity session is open. Returns Binance''s TradFi perpetual board: per
    contract mark, index, basis, funding, 24h change and volume, open interest, 24h recorded liquidations,
    other venues listing the same underlying, and the trading-session state per market. Filter by market
    (EQUITY, HK_EQUITY, KR_EQUITY, CN_EQUITY, COMMODITY, INDEX, PREMARKET) or one symbol. Without symbol,
    the first 30 contracts by open interest; pass symbol, or limit (up to 150) for more.'
- name: get_rsi_heatmap
  description: Call this when the user asks which coins are overbought or oversold, for a crypto RSI heatmap,
    multi-timeframe RSI, or one contract's RSI on 15m, 1h, 4h, 12h, 1d, 3d, 1w or 1M. Returns the live
    board for the top-400 Binance crypto perps by volume plus every TradFi perp, with overbought/oversold
    counts per interval. Filter by symbol or kind (crypto|tradfi), sort by an interval. Without symbol,
    the first 30 rows (by volume, or by the sort interval); pass limit (up to 400) for more, or order
    asc with sort for the most oversold first.
- name: get_cycle_indicators
  description: Call this when the user asks whether Bitcoin is near a cycle top or bottom by the classic
    indicators, about the Pi Cycle Top, Mayer Multiple, 200-week moving average, 2-year MA multiplier,
    golden ratio multiple, profitable days, stock-to-flow, Puell Multiple or Bitfinex margin positioning.
    Returns the latest readings, the Pi Cycle cross dates on record, and optionally the daily series (recomputed
    nightly from a first-party close record since 2012). Levels, not forecasts.
- name: get_hl_whales
  description: Call this when the user asks what Hyperliquid whales are doing, whether the biggest Hyperliquid
    accounts are net long or short a coin, for the largest open positions with liquidation prices, or
    what large accounts just opened, closed or flipped. Returns the live board of the 300 largest accounts
    by equity (scanned every 5 minutes, addresses only) and with events the last 200 position changes.
    Without coin, the 30 largest coins and positions; pass coin, or limit (up to 200) for more.
- name: get_positioning
  description: Call this when the user asks about the long/short ratio, whether retail or top traders
    are net long or short, the taker buy/sell ratio, or CVD (cumulative volume delta) for a perpetual.
    Returns exchange-published statistics for the 30 most traded Binance USDT perps on every perpetual
    venue the positioning board records (Binance global and top-trader ratios, Bybit share long, OKX ratios
    and taker volume, Gate account and top-trader ratios, HTX elite ratios, Bitget account and position
    ratios) and CVD series for BTC, ETH and SOL; refreshed every 15 minutes. Without symbol, the 10 most
    traded perps and the newest 24 points of each CVD series; pass symbol, limit or cvd_points for more.
- name: get_desk_notes
  description: 'Call this when the user asks what happened in crypto derivatives today or on a date, what
    the desk observed, what moved in funding, open interest, liquidations, options, ETF flows or exchange
    premiums, or wants a dated, quotable sentence with its number and time. Returns the desk''s notes
    newest first: each is one observation written by the desk writer (an AI model) from the platform''s
    own recorded data and checked against it before publishing, with its publish time in UTC, the card''s
    data time, the desk''s 0 to 10 news value, the board it read from, the coins it names and its permanent
    URL. Information about the data, never advice. Default the last 24 hours; pass day for one UTC day,
    since for a window up to 7 days back, type for one card type (funding-arb, liqmap-btc, event-liq-burst,
    ...), lang for zh, ru or ko text.'
- name: get_turkey_premium
  description: 'Call this when the user asks about Bitcoin, Ether or USDT prices in Turkish lira, the
    Turkey premium, the USDT/TRY rate or dollar premium in Turkey, or which Turkish exchanges (BtcTurk,
    Bitlo, CoinTR, OKX TR, Binance TR, Bybit TR, Bitexen; KuCoin TR contributes the USDT pairs only) trade
    above or below the global price. Returns the live board: the Turkey Premium Index (what a lira buyer
    pays for bitcoin against the global dollar price at the official exchange rate, in bps) with its dollar
    leg and crypto leg, a 0-100 score (50 = world price) and regime, 24h and 7d averages and the same-sign
    streak; then five reference prices (median of eligible order books), per-venue book status, spread,
    depth and each venue''s implied premium. Pass pair and history_days for 15-minute history of one pair.
    Without pair, the daily rows cover the last 7 days; pass pair, or daily_days (up to 30) for more.'
- name: get_data_proof
  description: 'Call this when the user asks whether ByKaranteli data can be verified or was changed afterwards,
    about the BYK Data Layer, on-chain proofs of market data, or wants the proof behind one sealed number.
    Every 5 minutes a catalog of derived feeds (funding composite, aggregate open interest, liquidations,
    depth within 2%, pressure scores, Kimchi and Turkey premiums) is sealed into one Merkle root, signed
    and written to Solana mainnet, and attested on Base once a day. With no arguments returns the stream
    overview: network, epochs and records sealed, final anchors and the newest epochs with explorer links.
    Pass feed and asset for one record''s proof (value, 104-byte leaf, Merkle path, signed manifest, signature,
    Solana and Base anchors) at the newest epoch or at sequence; sequence alone for one epoch; catalog
    for the feed list. result ANCHORED means ByKaranteli signed it and an anchor is final; the protocol
    verdict is reached from the chains alone at https://bykaranteli.com/proof.'
- name: get_jupiter_perps
  description: 'Call this when the user asks about Jupiter perpetuals on Solana: long versus short open
    interest per market (SOL, ETH, BTC) read from the on-chain custody state, pool utilization and hourly
    borrow rates, JLP pool AUM and APR, 24h volume, or the week''s top traders by realized PnL. Pass base
    and history_days for the hourly OI history.'
- name: get_market_profile
  description: Call this when the user asks about a perpetual's Market Profile, TPO profile, point of
    control (POC), value area (VAH, VAL), initial balance or naked (untested) points of control. Returns
    one row per closed UTC day from ByKaranteli's own one-minute bars of the Binance USDT-M perpetual
    (30-minute TPO periods, buckets of 0.05% of the day's open, 70% value area, first-hour initial balance,
    volume point of control), the naked points of control of the last 60 recorded days and the latest
    day's profile per price bucket. Symbols without recorded minute bars return no_profile.
- name: get_options_chain
  description: 'Call this when the user asks how the BTC or ETH option chain moved today or over the last
    day: open interest and mark IV per expiry and strike from ByKaranteli''s own hourly capture of every
    listed venue, the change over the last hour and the last 24 hours, and the front expiry''s ATM IV
    hour by hour. The Free plan lists the largest strikes; Builder and higher plans list every strike.
    Recorded from 2026-09-30, so the first days carry a short history.'
- name: get_hl_positions
  description: Call this when the user asks where Hyperliquid whales would be liquidated, how much tracked
    notional sits at each price, how the largest accounts lean on a coin, or how their liquidation prices
    compare with the LiqMap model. The universe is the largest accounts by equity on Hyperliquid's public
    leaderboard, scanned every five minutes; the levels are their own liquidation prices bucketed around
    the mark. hours returns the hourly archive of level totals.
- name: get_venue_share
  description: Call this when the user asks which exchange sees the most liquidations, how that share
    moved this week or this month, or how perpetual open interest splits between venues. Shares over one,
    seven or thirty days from ByKaranteli's own hourly liquidation record (counted venues only, each with
    the day its record started) and the hourly open interest record.
- name: get_tradfi_gaps
  description: Call this when the user asks what a stock, index or commodity perpetual did over the weekend
    or overnight while the cash market was closed, how far it sat from the last cash close at each checkpoint,
    how the venues disagreed, and what gap the next open then realised. From ByKaranteli's own ten-minute
    venue record; window weekend or night; one symbol or the whole board. Without symbol, the first 15
    underlyings of the summary and of the latest window; pass symbol, or limit (up to 60) for more.
- name: get_solana_perps
  description: 'Call this when the user asks about perpetuals on Solana as a whole, which Solana perp
    DEX has the most open interest or volume, a market on Pacifica, Phoenix, GM Trade (GMX on Solana),
    Velocity (the Drift relaunch) or Bullet (funding, open interest, 24h volume, mark), or how Jupiter
    compares with the order-book venues. Returns the board read every 10 minutes: per-venue totals (one-sided
    open interest, both sides on pool venues, 24h volume, market count, median hourly rate, as_of), every
    market of every venue largest first with instrument type (perpetual, equity, index, commodity, fx),
    and optional hourly history of one market on any venue but Jupiter (7 days on the Free plan, 30 on
    Builder and higher plans; Jupiter history is get_jupiter_perps). Without venue, the 30 largest markets;
    pass venue, or limit (up to 300) for more.'
- name: get_coverage
  description: 'Call this when the user asks which exchanges sit behind a ByKaranteli number, whether
    a feed is complete or sampled, since when a venue is collected, or how fresh the data is. Returns
    the live coverage registry: liquidation feeds per venue with kind and last record, snapshot feeds
    per venue and market, funding arbitrage legs, positioning sources, whale tape, spot minutes and the
    Hyperliquid whale scan with freshness. snapshots[].country is the jurisdiction only when the venue
    states one; it is null for most venues, so do not read null as unknown risk. By default the first
    30 snapshot feeds, English notes only and no per-venue matrix cells; pass detail=true for the full
    registry.'
- name: get_orderbook_depth
  description: 'Call this when the user asks where the bid or ask walls are, how deep the spot order book
    is, whether buyers or sellers have more resting orders near price, or for an order book heatmap. Returns
    the books of every spot venue with a public book that the coverage page lists, binned into 0.1% buckets
    within 20% of mid (USD notional), the largest walls with venue split, 2% depth and book reach per
    venue, and optionally the summed 5-minute history; coins: BTC, ETH, SOL, XRP, DOGE, ADA, LINK, AVAX,
    LTC, BNB. Books whose size is not corroborated are recorded and returned per venue with in_aggregate
    false (listed in held_out) but not summed into the walls, 2% depth or history.'
- name: get_series
  description: 'Call this when the user wants the history of one recorded metric for one perpetual as
    a time series: price candles, volume, perp or spot CVD, open interest, funding (one venue, or OI-weighted
    across every venue as funding_agg), liquidations, long/short ratios, RSI, the Coinbase premium, US
    spot ETF flows, borrow rates or Hyperliquid whale net flow, for charting, backtesting or "what did
    X do over the last N days". Returns the /api/series answer (points as [t, v], or [t, o, h, l, c, v]
    for price, with unit, kind, source and source_kind, the bars served and whether member depth applied)
    plus provenance. metric is one of: price, volume, cvd_perp, cvd_spot, oi, funding, funding_agg, liquidations,
    long_short, top_traders, rsi, premium, etf_flow, borrow, whale_net (unit, finest period and venue
    support of each: https://bykaranteli.com/api/series/metrics). The Free plan gets public depth: fewer
    bars and no bars under 15 minutes (1m, 3m, 5m, 10m); Builder and higher plans get member depth; the
    bar limits are in the same list. The answer names the venue it was read from (venue) and every venue
    a market-wide series sums (venues). Without from or limit, the newest 300 bars; pass from and to (ISO)
    for a window, or limit for more of the newest bars.'
- name: parse_alert_text
  description: 'Call this when the user describes an alert in words ("tell me when ETH drops 5% in a day",
    "BTC funding above 5 bps", "liquidations over $20M in an hour") and you want the exact recipe before
    creating it. Rule based, nothing is saved: returns recipe (name, scope, symbols, conditions of field,
    op, value, cooldownHours, channels) or null, confidence 0..1, a one-line summary to confirm with the
    user, and unresolved (what the text left open or what was assumed; timing words are not part of a
    recipe). A threshold the text does not state is never invented. English and tickers; at most 500 characters.
    Pass the returned conditions, scope, symbols and channels to create_alert_recipe once the user agrees.'
- name: list_alert_recipes
  description: Call this when the user asks which alerts they have, whether an alert fired, or before
    deleting or changing one. Returns the account's alert recipes (id, name, scope, symbols, conditions,
    cooldown in hours, enabled, last fired, fire count, channels). Needs a signed-in account (OAuth sign-in
    or account key); reads nothing but this account.
- name: create_alert_recipe
  description: 'Call this when the user asks to be alerted when a metric crosses a threshold and has agreed
    to the exact condition (parse_alert_text turns their words into one). Saves an alert recipe on the
    account: it fires when every condition holds, delivers by Telegram first with email as fallback unless
    channels says otherwise, and waits cooldown_hours before it fires again for the same symbol. field
    is one of: mark_price, pressure_score, funding_rate_pct, oi24h_pct, basis_pct, price_change_24h_pct,
    liq_cluster_distance_pct, usdt_peg_min_usd, usdc_peg_min_usd, liq_1h_usd, rsi_4h, ls_ratio_global,
    book_imbalance_2pct_pct, withdrawal_paused_venues, max_leverage_min, borrow_apr_pct, hl_whale_long_share_pct;
    op is one of >= > <= < ==; percent fields take percent values (0.05 means 0.05%). Pass field, op and
    threshold for one condition, or conditions for up to 6. scope: watchlist (default), any, or symbols
    with symbols. The plan sets how many recipes an account keeps; past it the tool answers with the limit.
    Writes are rate limited per connection (sign-in or key) and each one is recorded on the account.'
- name: delete_alert_recipe
  description: Call this when the user asks to remove an alert. Deletes the alert recipe with this id
    from the account (list_alert_recipes shows the ids); an id that is not one of the account's recipes
    changes nothing and says so. Writes are rate limited per connection (sign-in or key) and each one
    is recorded on the account.
- name: list_watchlists
  description: Call this when the user asks what is on their watchlist, which lists they have, or before
    adding or removing a symbol. Returns the account's watchlists (id, name, symbol count) and, unless
    include_symbols is false, the symbols on each list in order. Needs a signed-in account (OAuth sign-in
    or account key); reads nothing but this account.
- name: add_watchlist_symbol
  description: Call this when the user asks to watch, follow or add a coin to their watchlist. Adds the
    symbol to the list named by watchlist_id, else to the default list (or the only list the account has);
    a symbol already on the list stays once. Returns the list's symbols after the change. Writes are rate
    limited per connection (sign-in or key) and each one is recorded on the account.
- name: remove_watchlist_symbol
  description: Call this when the user asks to stop watching a coin or remove it from their watchlist.
    Removes the symbol from the list named by watchlist_id, else from the default list (or the only list
    the account has); a symbol that is not on the list changes nothing. Returns the list's symbols after
    the change. Writes are rate limited per connection (sign-in or key) and each one is recorded on the
    account.
- name: list_tracked_addresses
  description: Call this when the user asks which Hyperliquid addresses they follow, or what those addresses
    hold right now. Returns every followed address with its label, the positions last seen on it and the
    plan's address limit; following addresses is part of Terminal and the plans above it.
- name: add_tracked_address
  description: Call this when the user asks to follow, track or get alerts for a Hyperliquid address (0x
    followed by 40 hex characters). Every later position change of the address (opened, closed, increased,
    reduced, flipped) reaches the user's alert channels; the first sight is the baseline and sends nothing.
    Counted against the plan's address limit; the route answers terminal_required or limit_reached when
    it cannot add.
- name: remove_tracked_address
  description: Call this when the user asks to stop following or tracking a Hyperliquid address. Takes
    the id from list_tracked_addresses; the address's alerts stop, its recorded events stay.
notes:
- Input schemas above are the REAL ones returned by an anonymous tools/list — the verbatim JSON-RPC result
  (with full JSON Schema per tool) is saved at mcp/bykaranteli-mcp-tools.json. Fourteen of the twenty
  tools take no parameters at all.
- The /developers page and the npm README both say "20 tools"; live introspection confirms exactly 20.
  An older apis.io note about the page stale-stating 10 tools no longer applies.
- The MCP surface reads the FREE public API only. None of the 13 paid /api/x402/* endpoints are exposed
  as MCP tools — an agent that wants history/depth must pay over x402 directly. See mcp/bykaranteli-tool-crosswalk.yml.
