summary: >-
  The three surfaces do not overlap the way they usually do. The OpenAPI covers
  ONLY the paid x402 endpoints; the MCP server covers ONLY the free public data;
  the free REST surface has no OpenAPI at all. So almost every crosswalk row is
  a divergence, not a binding. The one genuine intersection is topical rather
  than operational: several MCP tools return a live/snapshot view of the same
  data domain whose HISTORY the matching x402 operation sells.

