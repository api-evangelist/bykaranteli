observed_divergence:
  finding: >-
    /api/public/* returns camelCase (generatedAt, winRatePct, profitFactorNet)
    while /api/v1/public/* returns snake_case (generated_at, win_rate_pct,
    profit_factor_net). Same data, same host, two conventions. A client written
    against the docs will break when moved to the versioned surface.
  evidence:
    - {url: 'https://bykaranteli.com/api/public/recent?hours=24&limit=3', status: 200}
