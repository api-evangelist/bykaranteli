openapi: 3.2.0
info:
  title: ByKaranteli crypto derivatives data X402 API
  version: 1.0.0
  description: 'Crypto derivatives market structure recorded around the clock. The public endpoints are free with an account key (30 requests a minute on the Free API plan; Builder, Business and Scale plans raise the rate, add member depth and include the x402 catalog: a monthly ceiling and a history window on Builder and Business, the whole archive on Scale, the raw record routes from Business). The /api/x402/* endpoints sell depth and history per call for anonymous agents.'
  x-guidance: Endpoints under /api/public/*, /api/liqmap/public, /api/v1/public/datasets/* and /api/series take an account key in the Authorization header (Bearer bk_...); /api/v1/public/health, /api/v1/public/manifest, /api/v1/public/sitemap.json take none. Get a free key at https://bykaranteli.com/dashboard/api; plans at https://bykaranteli.com/developers#tiers. The /api/x402/* endpoints answer HTTP 402 with machine-readable payment requirements and settle in USDC on Solana or Base per successful response, or run unpaid under a Builder or higher key within the plan's catalog allowance (tier_required, raw_tier_required, history_window and x402_allowance_used name what the plan does not include, each with how to pay per call). A failed response settles nothing.
  contact:
    email: support@bykaranteli.com
    url: https://bykaranteli.com/developers
  license:
    name: ByKaranteli Data Licence
    url: https://bykaranteli.com/data#license
servers:
- url: https://bykaranteli.com
tags:
- name: X402
paths:
  /api/x402:
    get:
      summary: Free machine-readable catalog of the paid endpoints
      operationId: x402Catalog
      security: []
      responses:
        '200':
          description: Catalog of paid endpoints, prices and settlement rails
      tags:
      - X402
  /api/x402/liqmap-levels:
    get:
      summary: 'Full multi-exchange liquidation map snapshot for a Binance USDT-M perp: modeled…'
      operationId: liqmap-levels
      parameters:
      - name: symbol
        in: query
        required: false
        description: Ticker covered by LiqMap, e.g. BTC, ETH or SOL, with or without the USDT suffix (default BTC); the list is at https://bykaranteli.com/liqmap
        schema:
          type: string
      - name: timeframe
        in: query
        required: false
        description: 'Lookback window for the position model: 1h, 4h, 12h, 24h, 3d, 1w or 30d (default 24h)'
        schema:
          type: string
      - name: leverage
        in: query
        required: false
        description: 'Leverage group, default all: all, low (5x and 10x), medium (25x) or high (50x and 100x)'
        schema:
          type: string
      - name: exchange
        in: query
        required: false
        description: 'One venue''s model instead of the multi-venue merge, default all: all, binance, bybit, okx, gate, htx or hyperliquid'
        schema:
          type: string
      responses:
        '200':
          description: Requested data, returned after payment settles, or included on a paid plan's account key
          headers:
            x-x402-allowance-limit:
              description: Included answers where a monthly ceiling applies
              schema:
                type: integer
            x-x402-allowance-used:
              description: Included catalog calls used this calendar month (UTC)
              schema:
                type: integer
        '400':
          description: Unsupported symbol or timeframe (code INVALID_SYMBOL or INVALID_TIMEFRAME); never charged
        '401':
          description: A key header carried a value that is not a key (code key_required with reason; 2026-10-19) or an unknown or revoked account key (code invalid_key); never charged
        '402':
          description: 'Payment required: the response carries x402 payment requirements, plus credential_reason and credential_hint when a key header was present but carried no usable key; with an account key past the plan''s monthly ceiling, code x402_allowance_used'
        '403':
          description: 'Account key refusal, answered with how to pay per call: tier_required (the plan does not include the catalog)'
      x-raw-records: false
      x-included-from: builder
      x-payment-info:
        protocols:
        - x402: {}
        price:
          mode: fixed
          currency: USD
          amount: '0.100000'
        networks:
        - solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp
        - eip155:8453
        asset: USDC
      tags:
      - X402
